<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>good fixture</title>
<style>
  .fade { opacity: 1; transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .3s ease; }
  .hero { min-height: 100dvh; }
  button:focus-visible { outline: 2px solid #2f5d50; outline-offset: 3px; }
  input { font-size: 16px; }
  @media (prefers-reduced-motion: reduce) {
    .fade { transition: none; }
  }
</style>
</head>
<body>
  <button type="button" class="fade">按钮</button>
  <label for="email">邮箱</label>
  <input id="email" type="email" placeholder="you@example.com">
  <img src="cover.png" alt="">
  <a href="https://example.com" target="_blank" rel="noopener noreferrer">帮助</a>
</body>
</html>
