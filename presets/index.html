<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presets · 主题预览</title>
<link rel="stylesheet" href="../library/motion-kit.css">
<link rel="stylesheet" href="./editorial.css">
<link rel="stylesheet" href="./glass.css">
<link rel="stylesheet" href="./soft.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e9e5db; color: #1a1712;
    font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.55; padding: 28px 0 60px;
  }
  .wrap { width: min(900px, calc(100% - 32px)); margin-inline: auto; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .brand { font-weight: 700; letter-spacing: -0.02em; }
  .top a { margin-left: auto; color: #756e62; font-size: 12px; text-decoration: none; }
  .intro h1 { font-family: Georgia, serif; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; }
  .intro p { margin-top: 8px; color: #756e62; font-size: 13px; }
  .theme {
    margin-top: 18px; padding: 28px;
    border: 1px solid var(--line); border-radius: 22px;
    background: var(--bg); color: var(--ink);
    box-shadow: 0 18px 50px rgba(26, 23, 18, 0.08);
  }
  .theme h2 { font-family: var(--serif); font-size: 27px; font-weight: 500; letter-spacing: -0.02em; }
  .theme p { max-width: 52ch; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .theme .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .theme .card {
    margin-top: 18px; padding: 18px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel);
  }
  .theme .card b { display: block; font-size: 13px; }
  .theme .card span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
  .theme .field { display: grid; gap: 6px; max-width: 300px; margin-top: 18px; }
  .theme .field label { color: var(--muted); font-size: 11px; }
  .theme .field input {
    height: 42px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 16px;
  }
  .theme .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme .tag {
    display: inline-flex; padding: 4px 9px; border-radius: 999px;
    background: var(--accent); color: var(--mk-accent-ink);
    font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.06em;
  }
  .theme--dark .card { background: var(--panel); }
</style>
<script>
  document.documentElement.classList.add('mk-js');
  setTimeout(function () { if (!window.MotionKit) document.documentElement.classList.remove('mk-js'); }, 2500);
</script>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">UI Interaction Skill · Presets</span><a href="../index.html">← 返回首页</a></div>
  <div class="intro">
    <h1>三套气质，一套组件</h1>
    <p>只换 `--mk-*` 令牌与页面底色；按钮、卡片、开关、输入的行为不变。</p>
  </div>

  <section class="theme" data-theme="editorial" data-reveal>
    <span class="tag">EDITORIAL</span>
    <h2>编辑暖夜</h2>
    <p>暖纸、衬线、陶土色。适合品牌页、作品集、内容产品。</p>
    <div class="row">
      <button type="button" class="mk-btn mk-btn--primary" data-ripple data-haptic="tap" data-toast="Editorial · 主按钮">开始使用</button>
      <button type="button" class="mk-btn mk-btn--ghost" data-ripple data-ripple-color="rgba(26,23,18,.12)">了解更多</button>
      <span class="mk-badge">3</span>
    </div>
    <div class="card"><b>本周激活率</b><span>62.4% · 比上周提升 14.2%</span></div>
    <div class="field"><label for="e-email">工作邮箱</label><input id="e-email" type="email" placeholder="you@company.com"></div>
  </section>

  <section class="theme theme--dark" data-theme="glass" data-reveal>
    <span class="tag">GLASS</span>
    <h2>深空玻璃</h2>
    <p>深底、冷色、半透明。适合 AI 产品、开发者工具、夜间后台。</p>
    <div class="row">
      <button type="button" class="mk-btn mk-btn--primary" data-ripple data-haptic="tap" data-toast="Glass · 主按钮">开始使用</button>
      <button type="button" class="mk-btn mk-btn--glass" data-ripple data-toast="Glass · 玻璃按钮">玻璃按钮</button>
      <span class="mk-badge">12</span>
    </div>
    <div class="card"><b>本周激活率</b><span>62.4% · 比上周提升 14.2%</span></div>
    <div class="field"><label for="g-email">工作邮箱</label><input id="g-email" type="email" placeholder="you@company.com"></div>
  </section>

  <section class="theme" data-theme="soft" data-reveal>
    <span class="tag">SOFT</span>
    <h2>柔和晨雾</h2>
    <p>浅灰、柔和绿、低对比。适合健康、教育、日常工具。</p>
    <div class="row">
      <button type="button" class="mk-btn mk-btn--primary" data-ripple data-haptic="tap" data-toast="Soft · 主按钮">开始使用</button>
      <button type="button" class="mk-btn mk-btn--ghost" data-ripple data-ripple-color="rgba(43,42,39,.1)">了解更多</button>
      <span class="mk-badge">5</span>
    </div>
    <div class="card"><b>本周激活率</b><span>62.4% · 比上周提升 14.2%</span></div>
    <div class="field"><label for="s-email">工作邮箱</label><input id="s-email" type="email" placeholder="you@company.com"></div>
  </section>
</div>
<script src="../library/motion-kit.js" defer></script>
</body>
</html>
