<!DOCTYPE html>
<html lang="zh-CN" data-theme="editorial" data-density="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After · Morrow Coffee 结算流</title>
<link rel="stylesheet" href="../../design-core/tokens.css">
<link rel="stylesheet" href="assets/motion-kit.css">
<style>
  :root {
    --bg:#f4f1e8; --ink:#1a1712; --accent:#b85940; --accent-2:#2f5d50; --green:#2f5d50;
    --mk-accent:var(--accent); --mk-accent-ink:#fff8f0; --mk-glow:rgba(184,89,64,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(760px 480px at 84% 0%, rgba(184, 89, 64, 0.09), transparent 62%);
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; }

  .wrap { width: min(1040px, calc(100% - 36px)); margin-inline: auto; }
  .top { display: flex; align-items: center; gap: 14px; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.02em; }
  .brand i { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 10px; font-style: normal; }
  .back { margin-left: auto; color: var(--muted); font-size: 12px; }

  .steps { display: flex; align-items: center; gap: 8px; padding: 14px 0 30px; color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; }
  .steps span { display: inline-flex; align-items: center; gap: 6px; }
  .steps i { display: grid; width: 20px; height: 20px; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-style: normal; }
  .steps span.is-on { color: var(--accent); }
  .steps span.is-on i { border-color: var(--accent); background: var(--accent); color: #fff; }

  .grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 28px; align-items: start; padding-bottom: 60px; }
  .card { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
  .card + .card { margin-top: 14px; }
  h1 { font-family: var(--serif); font-size: clamp(30px, 4vw, 42px); font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; }
  .lead { margin-top: 8px; color: var(--muted); font-size: 13px; }
  h2 { font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -0.02em; }
  .label { display: block; margin: 16px 0 6px; color: var(--muted); font-size: 11px; }
  .field { display: grid; gap: 6px; }
  .field input, .field select { height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 16px; }
  .field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; }
  .option input { accent-color: var(--accent); margin-top: 3px; }
  .option b { display: block; font-size: 13px; }
  .option span { display: block; color: var(--muted); font-size: 11px; }
  .option:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184,89,64,.08); }

  .summary { position: sticky; top: 18px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .thumb { width: 54px; height: 54px; flex: none; border-radius: 10px; background: var(--thumb, linear-gradient(145deg, #2f5d50, #a8b99f)); }
  .item b { display: block; font-size: 13px; }
  .item span { display: block; color: var(--muted); font-size: 11px; }
  .item em { margin-left: auto; font-style: normal; font-size: 13px; font-variant-numeric: tabular-nums; }
  .total { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13px; }
  .total b { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
  .summary .mk-btn { width: 100%; margin-top: 18px; }
  .micro { margin-top: 10px; color: var(--muted); text-align: center; font-size: 10px; }

  .success {
    position: fixed; inset: 0; z-index: 100;
    display: none; place-items: center; padding: 24px;
    background: rgba(26, 23, 18, 0.46); backdrop-filter: blur(8px);
  }
  .success.is-on { display: grid; }
  .success__box {
    width: min(420px, 100%); padding: 34px; border-radius: 22px;
    background: var(--panel); text-align: center; box-shadow: var(--mk-shadow-2);
  }
  .success__mark {
    display: grid; width: 58px; height: 58px; margin: 0 auto 16px; place-items: center;
    border-radius: 50%; background: var(--green); color: #fff; font-size: 24px;
  }
  .success__box h2 { font-size: 28px; }
  .success__box p { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .success__box .mk-btn { margin-top: 20px; }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
    .summary { position: static; order: -1; }
    .two { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .wrap { width: calc(100% - 28px); }
    .card { padding: 18px; }
  }
</style>
<script>
  document.documentElement.classList.add('mk-js');
  setTimeout(function () { if (!window.MotionKit) document.documentElement.classList.remove('mk-js'); }, 2500);
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../demo-shell/index.html"><i>MO</i> Morrow Coffee</a>
    <a class="back" href="#" data-toast="返回购物车（演示）">← 返回</a>
  </header>

  <div class="steps" aria-label="结算进度">
    <span class="is-on"><i>1</i> 购物车</span>
    <span class="is-on"><i>2</i> 信息</span>
    <span class="is-on"><i>3</i> 支付</span>
  </div>

  <main class="grid">
    <div>
      <section class="card" data-reveal>
        <h1>最后一步，<br>把咖啡带回家</h1>
        <p class="lead">今天下单，明天烘焙，周三前送达。</p>
      </section>

      <section class="card" data-reveal>
        <h2>配送信息</h2>
        <div class="two">
          <div class="field"><label class="label" for="name">收件人</label><input id="name" autocomplete="name" placeholder="你的名字"></div>
          <div class="field"><label class="label" for="phone">手机号</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="138 0000 0000"></div>
        </div>
        <div class="field"><label class="label" for="address">地址</label><input id="address" autocomplete="street-address" placeholder="城市 / 街道 / 门牌号"></div>
        <fieldset style="border:0;margin-top:16px">
          <legend class="label" style="margin-top:0">配送方式</legend>
          <div style="display:grid;gap:8px">
            <label class="option"><input type="radio" name="ship" checked><span><b>标准配送 · 免费</b><span>预计 3–4 天到达</span></span></label>
            <label class="option"><input type="radio" name="ship"><span><b>次日达 · ¥12</b><span>工作日 11:00 前下单</span></span></label>
          </div>
        </fieldset>
      </section>

      <section class="card" data-reveal>
        <h2>支付方式</h2>
        <div style="display:grid;gap:8px;margin-top:14px">
          <label class="option"><input type="radio" name="pay" checked><span><b>微信支付</b><span>推荐；跳转后完成付款</span></span></label>
          <label class="option"><input type="radio" name="pay"><span><b>支付宝</b><span>支持花呗分期</span></span></label>
          <label class="option"><input type="radio" name="pay"><span><b>银行卡</b><span>Visa / Mastercard / UnionPay</span></span></label>
        </div>
      </section>
      <section class="card" data-reveal>
        <h2>给配送员的小费</h2>
        <p class="lead" style="font-size:12px">全部给配送员；可随时更改。</p>
        <div style="display:grid;gap:8px;margin-top:14px">
          <label class="option"><input type="radio" name="tip" value="0" checked><span><b>0%</b><span>这次不用</span></span></label>
          <label class="option"><input type="radio" name="tip" value="5"><span><b>5% · ¥6</b><span>谢谢你</span></span></label>
          <label class="option"><input type="radio" name="tip" value="10"><span><b>10% · ¥13</b><span>辛苦了</span></span></label>
        </div>
      </section>

    </div>

    <aside class="card summary" data-reveal="scale">
      <h2>订单摘要</h2>
      <div class="item"><span class="thumb" style="--thumb:linear-gradient(145deg,#2f5d50,#a8b99f)"></span><div><b>耶加雪菲 · 日晒</b><span>250g · 中浅烘</span></div><em>¥88</em></div>
      <div class="item"><span class="thumb" style="--thumb:linear-gradient(145deg,#6b4a3a,#c99b74)"></span><div><b>桂花拿铁 · 挂耳</b><span>10 包</span></div><em>¥40</em></div>
      <div class="total"><span>商品</span><span>¥128</span></div>
      <div class="total"><span>配送</span><span>免费</span></div>
      <div class="total"><span><b>合计</b></span><b>¥128</b></div>
      <button type="button" class="mk-btn mk-btn--primary" id="payBtn" data-ripple data-haptic="tap">确认支付 ¥128</button>
      <p class="micro">演示页面，不会产生真实扣款。</p>
    </aside>
  </main>
</div>

<div class="success" id="success" role="dialog" aria-modal="true" aria-labelledby="success-title" aria-hidden="true">
  <div class="success__box">
    <div class="success__mark" aria-hidden="true">✓</div>
    <h2 id="success-title">支付成功</h2>
    <p>订单 #MC-2048 已确认。烘焙完成后会短信通知你。</p>
    <button type="button" class="mk-btn mk-btn--primary" style="width:100%" data-toast="查看订单（演示）">查看订单</button>
    <button type="button" class="mk-btn mk-btn--ghost" style="width:100%;margin-top:8px" id="closeSuccess">继续逛逛</button>
  </div>
</div>

<script src="assets/motion-kit.js" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('payBtn');
    var success = document.getElementById('success');
    var close = document.getElementById('closeSuccess');
    var label = btn.textContent;

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '正在支付…';
      setTimeout(function () {
        btn.disabled = false;
        btn.textContent = label;
        success.classList.add('is-on');
        success.setAttribute('aria-hidden', 'false');
        if (window.MotionKit) {
          window.MotionKit.haptic('success');
          window.MotionKit.toast('支付成功（演示）');
        }
        close.focus();
      }, 900);
    });

    close.addEventListener('click', function () {
      success.classList.remove('is-on');
      success.setAttribute('aria-hidden', 'true');
      btn.focus();
    });
  });
</script>
</body>
</html>
