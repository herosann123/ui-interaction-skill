<!DOCTYPE html>
<html lang="zh-CN" data-theme="deep-space" data-density="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template · AI Chat（流式打字 / 玻璃 / 粒子）</title>
<link rel="stylesheet" href="../../design-core/tokens.css">
<link rel="stylesheet" href="../../library/motion-kit.css">
<style>
  :root {
    --bg:#0a0c11; --bg-2:#111722; --panel:#12151d; --panel-2:#181c26;
    --ink:#eef1f8; --muted:#9aa3b5; --line:rgba(235,240,255,.12);
    --accent:#8fb8ff; --accent-2:#6ee7c8; --font-display:"Iowan Old Style","Palatino Linotype","Songti SC",Georgia,serif;
    --mk-accent:var(--accent); --mk-accent-ink:#0a0c11; --mk-surface:var(--panel);
    --mk-ink:var(--ink); --mk-muted:var(--muted); --mk-border:var(--line);
    --mk-glass-bg:rgba(18,21,29,.62); --mk-glass-border:rgba(235,240,255,.14); --mk-glow:rgba(143,184,255,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font-family: inherit; }
  #particles {
    position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: 0.8;
  }
  .page { position: relative; z-index: 1; }
  .wrap { width: min(1180px, calc(100% - 48px)); margin-inline: auto; }

  .nav { display: flex; align-items: center; gap: 24px; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.02em; }
  .brand i {
    display: grid; width: 28px; height: 28px; place-items: center;
    border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a0c11; font-family: var(--mono); font-size: 11px; font-style: normal; font-weight: 700;
  }
  .nav__badge {
    margin-left: auto; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  }

  .layout {
    display: grid; grid-template-columns: 0.86fr 1.14fr;
    gap: clamp(28px, 5vw, 64px); align-items: center;
    min-height: calc(100dvh - 78px); padding: 24px 0 60px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--accent-2); font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
  h1 {
    margin-top: 20px; font-family: var(--serif); font-weight: 500;
    font-size: clamp(42px, 5.4vw, 72px); line-height: 0.98; letter-spacing: -0.04em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lead { max-width: 42ch; margin-top: 22px; color: var(--muted); font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 28px; }
  .chip {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(18, 21, 29, 0.5); color: var(--muted);
    font-size: 12px; cursor: pointer;
    transition: border-color 160ms linear, color 160ms linear, background-color 160ms linear;
  }
  .chip:hover { border-color: rgba(143, 184, 255, 0.4); color: var(--ink); }
  .chips .chip[disabled] { opacity: 0.5; cursor: wait; }
  .fine { margin-top: 18px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; }

  .chat {
    display: flex; flex-direction: column;
    height: min(680px, 82dvh); min-height: 540px;
    border: 1px solid var(--line); border-radius: 24px;
    background: rgba(18, 21, 29, 0.78);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
  }
  .chat__head {
    display: flex; align-items: center; gap: 11px;
    padding: 15px 18px; border-bottom: 1px solid var(--line);
    background: rgba(10, 12, 17, 0.45);
  }
  .chat__orb {
    width: 30px; height: 30px; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 0 22px rgba(143, 184, 255, 0.35);
  }
  .chat__head b { display: block; font-size: 13px; }
  .chat__head span { display: block; color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; }
  .chat__live {
    display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
    color: var(--accent-2); font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
  }
  .chat__live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(110, 231, 200, 0.14); }

  .messages {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 20px 18px 8px; display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: rgba(235, 240, 255, 0.14); background-clip: padding-box; }
  .msg { display: flex; gap: 10px; max-width: 92%; animation: msg-in 420ms var(--mk-ease-out) both; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(10px); } }
  .msg--user { align-self: flex-end; flex-direction: row-reverse; }
  .msg__avatar {
    display: grid; flex: none; width: 26px; height: 26px; place-items: center;
    border-radius: 50%; background: rgba(143, 184, 255, 0.14); color: var(--accent);
    font-family: var(--mono); font-size: 10px;
  }
  .msg--user .msg__avatar { background: rgba(110, 231, 200, 0.12); color: var(--accent-2); }
  .bubble {
    padding: 12px 15px; border: 1px solid var(--line); border-radius: 16px 16px 16px 5px;
    background: var(--panel-2); font-size: 14px;
  }
  .msg--user .bubble { border-radius: 16px 16px 5px 16px; background: rgba(143, 184, 255, 0.12); border-color: rgba(143, 184, 255, 0.24); }
  .bubble p + p { margin-top: 10px; }
  .bubble strong { color: var(--accent-2); font-weight: 600; }
  .bubble .mk-caret { background: var(--accent-2); }
  .msg__meta { display: flex; gap: 10px; margin-top: 9px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
  .msg__meta button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .msg__meta button:hover { color: var(--ink); }

  .typing { display: inline-flex; gap: 5px; align-items: center; height: 18px; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
    animation: blink 1.1s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.16s; }
  .typing i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

  .composer {
    display: flex; align-items: flex-end; gap: 10px;
    margin: 8px 14px 14px; padding: 9px 9px 9px 14px;
    border: 1px solid var(--line); border-radius: 18px;
    background: rgba(10, 12, 17, 0.55);
  }
  .composer:focus-within { border-color: rgba(143, 184, 255, 0.45); }
  .composer textarea {
    flex: 1; max-height: 120px; min-height: 24px; padding: 6px 0;
    border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; line-height: 1.45; resize: none;
    outline: 2px solid transparent; outline-offset: 2px;
  }
  .composer textarea:focus-visible { outline-color: var(--accent-2); }
  .composer textarea::placeholder { color: var(--muted); }
  .composer .mk-btn { flex: none; min-height: 38px; padding: 8px 16px; font-size: 13px; }
  .composer .mk-btn[disabled] { opacity: 0.45; }
  .chat__foot {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 0 18px 12px; color: var(--muted); font-family: var(--mono); font-size: 9px;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; min-height: 0; padding-top: 8px; }
    .intro { padding: 24px 0 6px; }
    .chat { height: min(620px, 78dvh); min-height: 480px; }
  }
  @media (max-width: 560px) {
    .wrap { width: calc(100% - 28px); }
    .chat { border-radius: 20px; }
    .messages { padding-inline: 12px; }
    .msg { max-width: 100%; }
    .chat__live { display: none; }
  }
</style>
<script>
  document.documentElement.classList.add('mk-js');
  setTimeout(function () { if (!window.MotionKit) document.documentElement.classList.remove('mk-js'); }, 2500);
</script>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>

<div class="page">
  <header class="wrap nav">
    <a class="brand" href="#"><i>N</i> Northwind Copilot</a>
    <span class="nav__badge">模型 · copilot-v2</span>
  </header>

  <main class="wrap layout">
    <section class="intro">
      <p class="eyebrow" data-reveal="fade">Ask your data</p>
      <h1 data-reveal-stagger="80">
        <span>用一句话</span><br>
        <span><em>问清楚</em>数据</span>
      </h1>
      <p class="lead" data-reveal data-reveal-delay="120">Copilot 连接你的看板与事件表。用自然语言提问，它会把指标、变化与下一步建议一起讲清楚。</p>
      <div class="chips" data-reveal data-reveal-delay="180">
        <button type="button" class="chip" data-prompt="帮我总结一下这周的漏斗变化，并给一个下一步建议。">总结本周漏斗变化</button>
        <button type="button" class="chip" data-prompt="哪些渠道的新用户留存最差？">找出留存最差的渠道</button>
        <button type="button" class="chip" data-prompt="把本月 MRR 拆成新增、扩张和流失三部分。">拆解本月 MRR</button>
      </div>
      <p class="fine" data-reveal="fade" data-reveal-delay="240">流式输出 · 光标跟随 · 完成后可复制</p>
    </section>

    <section class="chat" aria-label="Northwind Copilot 对话演示">
      <header class="chat__head">
        <span class="chat__orb" aria-hidden="true"></span>
        <div>
          <b>Northwind Copilot</b>
          <span>CONNECTED · OVERVIEW / 2026 Q4</span>
        </div>
        <span class="chat__live">LIVE</span>
      </header>

      <div class="messages" id="messages" role="log" aria-live="off">
        <div class="msg msg--user">
          <span class="msg__avatar" aria-hidden="true">YOU</span>
          <div class="bubble"><p>帮我总结一下这周的漏斗变化，并给一个下一步建议。</p></div>
        </div>

        <div class="msg msg--ai">
          <span class="msg__avatar" aria-hidden="true">N</span>
          <div class="bubble">
            <p
              data-stream
              data-stream-speed="22"
              data-stream-text="根据你上周的漏斗数据，注册→激活的转化率从 48% 升到 62%，主要来自新 onboarding 流程。建议下一步把激活定义拆成「创建项目」和「邀请成员」两段，这样能看清是哪一步在拉动。"
            ></p>
            <div class="msg__meta">
              <button type="button" data-replay>↻ 重新播放</button>
              <button type="button" data-copy>复制</button>
              <span>COPILOT-V2 · 2.1s</span>
            </div>
          </div>
        </div>
      </div>

      <form class="composer" id="composer">
        <label class="sr-only" for="prompt">输入问题</label>
        <textarea id="prompt" rows="1" placeholder="问点什么… 例如：哪个渠道的激活率最高？"></textarea>
        <button type="submit" class="mk-btn mk-btn--primary" data-ripple data-ripple-color="rgba(10,12,17,0.3)" data-haptic="tap">发送</button>
      </form>
      <div class="chat__foot">
        <span>Enter 发送 · Shift+Enter 换行</span>
        <span>演示数据，不连接真实看板</span>
      </div>
    </section>
  </main>
</div>

<script src="../../library/motion-kit.js" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var messages = document.getElementById('messages');
    var composer = document.getElementById('composer');
    var input = document.getElementById('prompt');
    var sendBtn = composer.querySelector('button[type="submit"]');
    var chips = Array.prototype.slice.call(document.querySelectorAll('[data-prompt]'));
    var busy = false;
    var srStatus = document.createElement('p');
    srStatus.className = 'sr-only';
    srStatus.setAttribute('aria-live', 'polite');
    document.body.appendChild(srStatus);

    var replies = [
      '从最近 7 天看，注册→激活的提升主要发生在移动端：新 onboarding 把步骤从 5 步压到 3 步，完成率提高了 14 个百分点。建议继续观察「邀请成员」这一步，它在团队账户里的掉队最明显。',
      '渠道对比里，付费搜索的新用户 7 日留存最低（31%），自然搜索最高（54%）。如果预算不变，可以把一部分投放转向内容合作，并用 7 日留存作为优化目标，而不是只看注册成本。',
      '本月 MRR 可以拆成：新增 ¥186k、扩张 ¥74k、流失 -¥38k。净增长里扩张贡献最大，但流失集中在 3 个月以内的新客户。建议给新客户增加一次第 30 天的健康检查。'
    ];
    var replyIndex = 0;

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(120, input.scrollHeight) + 'px';
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      chips.forEach(function (chip) { chip.disabled = value; });
    }

    function addMessage(role, text) {
      var msg = document.createElement('div');
      msg.className = 'msg msg--' + role;
      var avatar = document.createElement('span');
      avatar.className = 'msg__avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = role === 'user' ? 'YOU' : 'N';
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      var p = document.createElement('p');
      p.textContent = text;
      bubble.appendChild(p);
      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messages.appendChild(msg);
      scrollToBottom();
      return { msg: msg, bubble: bubble, text: p };
    }

    function addTyping() {
      var msg = document.createElement('div');
      msg.className = 'msg msg--ai';
      var avatar = document.createElement('span');
      avatar.className = 'msg__avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = 'N';
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="typing" aria-label="正在输入"><i></i><i></i><i></i></span>';
      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messages.appendChild(msg);
      scrollToBottom();
      return msg;
    }

    function respond(text) {
      setBusy(true);
      srStatus.textContent = 'Copilot 正在回复';
      var typing = addTyping();
      setTimeout(function () {
        typing.remove();
        var node = addMessage('ai', '');
        node.bubble.innerHTML = '';
        node.text = document.createElement('p');
        node.bubble.appendChild(node.text);
        var meta = document.createElement('div');
        meta.className = 'msg__meta';
        meta.innerHTML = '<button type="button" data-copy>复制</button><span>COPILOT-V2 · LIVE</span>';
        node.bubble.appendChild(meta);

        if (window.MotionKit) {
          window.MotionKit.stream(node.text, text, { speed: 20 }).then(function () {
            setBusy(false);
            srStatus.textContent = '回复已完成';
            scrollToBottom();
          });
        } else {
          node.text.textContent = text;
          setBusy(false);
        }
        scrollToBottom();
      }, 620);
    }

    function submitPrompt(value) {
      var text = (value || input.value || '').trim();
      if (!text || busy) return;
      addMessage('user', text);
      input.value = '';
      autoGrow();
      var reply = replies[replyIndex % replies.length];
      replyIndex += 1;
      respond(reply);
    }

    composer.addEventListener('submit', function (e) {
      e.preventDefault();
      submitPrompt();
    });

    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        submitPrompt();
      }
    });

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        submitPrompt(chip.dataset.prompt);
      });
    });

    messages.addEventListener('click', function (e) {
      var replay = e.target.closest('[data-replay]');
      var copy = e.target.closest('[data-copy]');
      if (replay) {
        var p = replay.closest('.bubble').querySelector('p');
        if (p && window.MotionKit) {
          window.MotionKit.stream(p, p.dataset.fullText || p.textContent, { speed: 22 });
        }
      }
      if (copy) {
        var bubble = copy.closest('.bubble');
        var target = bubble.querySelector('p');
        var value = target ? target.textContent : bubble.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(function () {
            copy.textContent = '已复制';
            setTimeout(function () { copy.textContent = '复制'; }, 1400);
          }).catch(function () {});
        }
      }
    });

    // 记住初始流式文本，便于“重新播放”
    var initial = messages.querySelector('[data-stream]');
    if (initial) initial.dataset.fullText = initial.dataset.streamText;

    autoGrow();
  });

  /* ---------- 轻量粒子背景（⑫） ---------- */
  (function () {
    var canvas = document.getElementById('particles');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    var points = [];
    var raf = 0;
    var running = false;
    var w = 0;
    var h = 0;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    function resize() {
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var count = Math.max(24, Math.min(70, Math.floor((w * h) / 26000)));
      points = [];
      for (var i = 0; i < count; i += 1) {
        points.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          r: Math.random() * 1.5 + 0.6
        });
      }
    }

    function draw() {
      raf = 0;
      if (!running) return;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(143,184,255,0.6)';
      ctx.strokeStyle = 'rgba(143,184,255,0.14)';
      ctx.lineWidth = 1;
      for (var i = 0; i < points.length; i += 1) {
        var p = points[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        for (var j = i + 1; j < points.length; j += 1) {
          var q = points[j];
          var dx = p.x - q.x;
          var dy = p.y - q.y;
          var d2 = dx * dx + dy * dy;
          if (d2 < 12000) {
            ctx.globalAlpha = 1 - d2 / 12000;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }
      raf = requestAnimationFrame(draw);
    }

    function start() {
      if (running || reduce.matches || document.hidden) return;
      running = true;
      if (!raf) raf = requestAnimationFrame(draw);
    }

    function stop() {
      running = false;
      if (raf) {
        cancelAnimationFrame(raf);
        raf = 0;
      }
      ctx.clearRect(0, 0, w, h);
    }

    function boot() {
      if (reduce.matches) {
        stop();
        return;
      }
      resize();
      start();
    }

    window.addEventListener('resize', function () {
      if (!reduce.matches) resize();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop();
      else start();
    });
    if (reduce.addEventListener) {
      reduce.addEventListener('change', boot);
    }
    boot();
  })();
</script>
</body>
</html>
