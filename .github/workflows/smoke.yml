name: smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chrome
        run: google-chrome --version
      - name: Browser smoke (390px + reduced-motion)
        run: node scripts/smoke.mjs --viewports 390,768,1280 --report .smoke-report.md --screenshots .smoke-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: |
            .smoke-shots
            .smoke-report.md
          if-no-files-found: ignore
