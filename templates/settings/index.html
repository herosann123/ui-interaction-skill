<!DOCTYPE html>
<html lang="zh-CN" data-theme="editorial" data-density="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template · Settings（Tabs / 表单 / 保存栏）</title>
<link rel="stylesheet" href="../../design-core/tokens.css">
<link rel="stylesheet" href="../../library/motion-kit.css">
<style>
  :root {
    --bg:#f3f0e7; --ink:#1a1712; --accent:#2f5d50; --accent-2:#b85940; --panel-2:#f8f4eb;
    --mk-accent:var(--accent); --mk-accent-ink:#f7f3ea; --mk-glow:rgba(47,93,80,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(760px 480px at 88% 0%, rgba(47, 93, 80, 0.08), transparent 62%);
  }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; }

  .wrap { width: min(1080px, calc(100% - 36px)); margin-inline: auto; }
  .top { display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.02em; }
  .brand i { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: var(--accent); color: var(--bg); font-family: var(--mono); font-size: 10px; font-style: normal; }
  .top nav { display: flex; gap: 18px; margin-left: auto; color: var(--muted); font-size: 12px; }
  .top nav a:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 28px 0 100px; }
  .aside h1 { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: -0.03em; }
  .aside p { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .aside nav { display: grid; gap: 4px; margin-top: 22px; }
  .aside nav button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px; border: 0; border-radius: 9px;
    background: transparent; color: var(--muted); font-size: 13px; text-align: left; cursor: pointer;
  }
  .aside nav button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .aside nav i { width: 16px; text-align: center; font-style: normal; }

  .mk-tabs__bar { border-bottom: 0; }
  .mk-tabs__viewport { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .panel { padding: 24px; }
  .panel h2 { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .panel > p { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .field { display: grid; gap: 6px; margin-top: 16px; }
  .field label { color: var(--muted); font-size: 11px; }
  .field input, .field select, .field textarea {
    height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); font-size: 16px;
  }
  .field textarea { height: auto; min-height: 90px; padding: 10px 12px; resize: vertical; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .switch-row:last-child { border-bottom: 0; }
  .switch-row b { display: block; font-size: 13px; }
  .switch-row span { display: block; color: var(--muted); font-size: 11px; }

  .savebar {
    position: fixed; left: 50%; bottom: 18px; z-index: 30;
    display: flex; align-items: center; gap: 14px;
    width: min(680px, calc(100% - 28px)); transform: translateX(-50%);
    padding: 10px 12px 10px 18px;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255, 253, 248, 0.92);
    box-shadow: 0 18px 50px rgba(26, 23, 18, 0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .savebar span { color: var(--muted); font-size: 12px; }
  .savebar .mk-btn { margin-left: auto; min-height: 38px; padding: 8px 18px; font-size: 13px; }
  .danger { color: var(--accent-2); }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .aside nav { display: flex; flex-wrap: wrap; }
    .aside nav button { width: auto; }
    .top nav { display: none; }
    .two { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .wrap { width: calc(100% - 28px); }
    .panel { padding: 18px; }
    .savebar { bottom: 10px; }
  }
</style>
<script>
  document.documentElement.classList.add('mk-js');
  setTimeout(function () { if (!window.MotionKit) document.documentElement.classList.remove('mk-js'); }, 2500);
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../demo-shell/index.html"><i>NW</i> Northwind</a>
    <nav aria-label="主导航"><a href="#">看板</a><a href="#">成员</a><a href="#">设置</a></nav>
  </header>

  <div class="layout">
    <aside class="aside">
      <h1>设置</h1>
      <p>管理个人资料、通知与安全。</p>
      <nav aria-label="设置分区">
        <button type="button" aria-current="page" data-tab-jump="0"><i>◯</i> 个人资料</button>
        <button type="button" data-tab-jump="1"><i>◔</i> 通知</button>
        <button type="button" data-tab-jump="2"><i>⌁</i> 安全</button>
        <button type="button" data-tab-jump="3"><i>◇</i> 账单</button>
      </nav>
    </aside>

    <main class="mk-tabs" data-tabs>
      <div class="mk-tabs__bar" role="tablist" aria-label="设置分区">
        <button type="button" class="mk-tabs__tab" role="tab" aria-selected="true" id="s-tab-0" aria-controls="s-panel-0">个人资料</button>
        <button type="button" class="mk-tabs__tab" role="tab" aria-selected="false" tabindex="-1" id="s-tab-1" aria-controls="s-panel-1">通知</button>
        <button type="button" class="mk-tabs__tab" role="tab" aria-selected="false" tabindex="-1" id="s-tab-2" aria-controls="s-panel-2">安全</button>
        <button type="button" class="mk-tabs__tab" role="tab" aria-selected="false" tabindex="-1" id="s-tab-3" aria-controls="s-panel-3">账单</button>
        <span class="mk-tabs__indicator" aria-hidden="true"></span>
      </div>

      <div class="mk-tabs__viewport" data-tabs-viewport>
        <section class="mk-tabs__panel panel" role="tabpanel" id="s-panel-0" aria-labelledby="s-tab-0" tabindex="0">
          <h2>个人资料</h2>
          <p>这些信息会展示给团队其他成员。</p>
          <div class="two">
            <div class="field"><label for="s-name">显示名称</label><input id="s-name" value="林芸"></div>
            <div class="field"><label for="s-email">工作邮箱</label><input id="s-email" type="email" value="lin@acme.com"></div>
          </div>
          <div class="field"><label for="s-bio">一句话介绍</label><textarea id="s-bio">负责 Acme 的增长与留存。</textarea></div>
        </section>

        <section class="mk-tabs__panel panel" role="tabpanel" id="s-panel-1" aria-labelledby="s-tab-1" tabindex="0">
          <h2>通知</h2>
          <p>只在你需要的时候打扰你。</p>
          <div style="margin-top:14px">
            <div class="switch-row"><div><b>周报摘要</b><span>每周一 09:00 发送</span></div><label class="mk-switch"><input type="checkbox" checked><span class="mk-switch__track"><span class="mk-switch__thumb"></span></span><span class="sr-only">周报摘要</span></label></div>
            <div class="switch-row"><div><b>异常波动</b><span>指标变化超过 20% 时提醒</span></div><label class="mk-switch"><input type="checkbox" checked><span class="mk-switch__track"><span class="mk-switch__thumb"></span></span><span class="sr-only">异常波动</span></label></div>
            <div class="switch-row"><div><b>评论与提及</b><span>有人回复你时</span></div><label class="mk-switch"><input type="checkbox"><span class="mk-switch__track"><span class="mk-switch__thumb"></span></span><span class="sr-only">评论与提及</span></label></div>
          </div>
        </section>

        <section class="mk-tabs__panel panel" role="tabpanel" id="s-panel-2" aria-labelledby="s-tab-2" tabindex="0">
          <h2>安全</h2>
          <p>登录方式与会话管理。</p>
          <div class="switch-row"><div><b>两步验证</b><span>使用验证器 App</span></div><button type="button" class="mk-btn mk-btn--ghost" style="min-height:36px;padding:6px 14px;font-size:12px" data-toast="两步验证设置（演示）">配置</button></div>
          <div class="switch-row"><div><b>当前会话</b><span>上海 · Chrome · 2 分钟前</span></div><button type="button" class="mk-btn mk-btn--ghost danger" style="min-height:36px;padding:6px 14px;font-size:12px" data-toast="已退出其他设备（演示）">退出其他设备</button></div>
        </section>

        <section class="mk-tabs__panel panel" role="tabpanel" id="s-panel-3" aria-labelledby="s-tab-3" tabindex="0">
          <h2>账单</h2>
          <p>当前套餐：成长 · ¥199 / 月。</p>
          <div class="switch-row"><div><b>下次扣款</b><span>2026-12-01 · Visa •••• 4242</span></div><button type="button" class="mk-btn mk-btn--ghost" style="min-height:36px;padding:6px 14px;font-size:12px" data-toast="账单管理（演示）">管理</button></div>
        </section>
      </div>
    </main>
  </div>
</div>

<div class="savebar" role="region" aria-label="保存设置">
  <span>你有未保存的更改</span>
  <button type="button" class="mk-btn mk-btn--primary" data-toast="设置已保存（演示）" data-haptic="success">保存更改</button>
</div>

<script src="../../library/motion-kit.js" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var tabs = document.querySelector('[data-tabs]');
    var tabButtons = Array.prototype.slice.call(tabs.querySelectorAll('[role="tab"]'));
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab-jump]'), function (btn) {
      btn.addEventListener('click', function () {
        var index = Number(btn.dataset.tabJump);
        if (tabButtons[index]) tabButtons[index].click();
        Array.prototype.forEach.call(document.querySelectorAll('[data-tab-jump]'), function (other) {
          other.removeAttribute('aria-current');
        });
        btn.setAttribute('aria-current', 'page');
      });
    });
  });
</script>
</body>
</html>
